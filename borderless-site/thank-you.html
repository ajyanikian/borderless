<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Thank you | Borderless</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f5f4ef; color:#171717; font-family:Arial,Helvetica,sans-serif; }
    main { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
    article { width:100%; max-width:600px; background:#fff; padding:48px 36px; border:1px solid #e4e0d8; }
    .brand { font-weight:900; font-size:21px; letter-spacing:-1px; margin-bottom:64px; }
    .eyebrow { text-transform:uppercase; letter-spacing:.15em; font-size:11px; font-weight:700; margin-bottom:15px; }
    h1 { font-size:clamp(34px,6vw,56px); line-height:1.02; letter-spacing:-.05em; margin:0 0 25px; }
    p { font-size:16px; line-height:1.55; max-width:44ch; }
    .status { padding:16px 18px; margin:30px 0; background:#f5f4ef; font-size:14px; line-height:1.5; }
    a { color:#171717; font-weight:700; text-underline-offset:4px; }
    .foot { font-size:13px; margin-top:55px; opacity:.7; }
    @media(max-width:500px){ article { padding:32px 23px; } .brand { margin-bottom:45px; } }
  </style>
</head>
<body>
<main><article>
  <div class="brand">borderless.</div>
  <div class="eyebrow">Palestinian Olive Oil</div>
  <h1 id="headline">Checking your order.</h1>
  <p id="detail">We're verifying your payment and preparing your order confirmation.</p>
  <div class="status" id="status" role="status" aria-live="polite">Checking secure order records…</div>
  <p><a href="/">Return to Borderless</a></p>
  <p class="foot">This is solidarity in practice.</p>
</article></main>
<script>
(async function () {
  const headline = document.getElementById('headline');
  const detail = document.getElementById('detail');
  const status = document.getElementById('status');
  const id = new URLSearchParams(location.search).get('session_id');
  if (!id || !/^cs_test_[A-Za-z0-9]+$/.test(id)) {
    headline.textContent = 'We can help.';
    detail.textContent = 'For confirmation of an order, please check your email or contact Borderless.';
    status.textContent = 'No verified order reference was provided.';
    return;
  }
  for (let attempt = 0; attempt < 12; attempt++) {
    try {
      const response = await fetch('/api/order-confirmation?session_id=' + encodeURIComponent(id), {cache:'no-store'});
      if (!response.ok) throw new Error('Unavailable');
      const order = await response.json();
      if (order.confirmed === true) {
        headline.textContent = 'Thank you for your order.';
        detail.textContent = 'Your order is confirmed. We will prepare it for shipping and send updates as they become available.';
        status.textContent = 'Payment confirmed. Order received.';
        return;
      }
    } catch (e) { /* transient failure: retry briefly */ }
    await new Promise(resolve => setTimeout(resolve, 2000));
  }
  headline.textContent = 'We received your checkout return.';
  detail.textContent = 'We have not yet verified your order in our system. Please check your receipt or contact Borderless before trying again.';
  status.textContent = 'Confirmation pending. You have not been charged again.';
})();
</script>
</body></html>
