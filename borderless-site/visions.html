<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Borderless — Share your vision</title>
<style>
:root{--blue:#2635ff;--ease:cubic-bezier(.25,.82,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:white}
body{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--blue);-webkit-font-smoothing:antialiased}
button,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
main{min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
.feature{width:100%;max-width:none;overflow:hidden;padding:0 0 5px}
.rule{height:1px;background:#e7e7e6;margin:0 clamp(24px,5.6vw,88px)}
h1{font-weight:200;font-size:clamp(28px,4.2vw,51px);letter-spacing:-.055em;line-height:1.17;text-align:center;margin:37px 20px 12px;color:var(--blue)}
h1 strong{font-weight:735;letter-spacing:-.065em}
.stage{height:151px;width:100%;position:relative;overflow:hidden;isolation:isolate;touch-action:pan-y}
.rail{position:absolute;left:0;top:50%;display:flex;align-items:center;gap:34px;width:max-content;height:150px;transform:translate3d(0,-50%,0);will-change:transform}
.note,.composer{flex:0 0 auto;position:relative;height:150px;display:flex;align-items:center;justify-content:center}
.note .tape-piece{filter:drop-shadow(0 5px 3px rgba(12,31,68,.19));transition:filter .25s ease,transform .4s var(--ease);transform:rotate(var(--rotation)) translateY(var(--shift))}
.note .tape-piece:hover,.note .tape-piece:focus-visible{filter:drop-shadow(0 8px 6px rgba(12,31,68,.22));transform:rotate(0deg) translateY(-3px)}
.tape-piece canvas{display:block;max-width:none}
.composer{width:416px;z-index:2}
.shell{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:236px;height:78px;border:1.5px dotted var(--blue);border-radius:34px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:1;transition:width .7s var(--ease),height .7s var(--ease),border-radius .7s var(--ease),border-color .34s ease,opacity .35s ease,transform .7s var(--ease)}
.prompt{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;color:var(--blue);display:flex;align-items:center;justify-content:center;gap:9px;font-size:12px;letter-spacing:-.01em;font-weight:650;white-space:nowrap;opacity:1;transform:translateY(0);transition:opacity .18s ease,transform .3s var(--ease)}
.prompt:hover{background:#fdfdff}
.prompt svg{width:14px;height:14px}
.entry{width:100%;height:100%;display:flex;align-items:center;gap:12px;padding:8px 11px 8px 24px;opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .26s ease,transform .42s var(--ease)}
.entry textarea{width:100%;flex:1;min-width:0;height:60px;padding:15px 0 5px;resize:none;border:0;outline:0;background:transparent;font-size:14px;line-height:1.42;letter-spacing:-.01em;color:#303b59}
.entry textarea::placeholder{color:#99a4ad;opacity:1}
.send{flex:0 0 43px;width:43px;height:43px;border-radius:50%;background:var(--blue);border:0;color:#fff;display:grid;place-items:center;transition:opacity .25s ease,background .2s ease,transform .2s ease}
.send:disabled{background:#c9cbff;cursor:default}
.send:not(:disabled):hover{transform:scale(1.05);background:#1726de}
.send svg{height:19px;width:19px}
.composer[data-state="writing"] .shell{width:min(414px,100%);height:90px;border-radius:33px}
.composer[data-state="writing"] .prompt{opacity:0;transform:translateY(-5px);pointer-events:none}
.composer[data-state="writing"] .entry{opacity:1;transform:translateY(0);pointer-events:auto;transition-delay:.15s}
.composer[data-state="writing"] .shell:focus-within{border-style:solid}
.formed{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.985);opacity:0;pointer-events:none;transition:opacity .55s ease,transform .8s var(--ease)}
.formed .tape-piece{filter:drop-shadow(0 5px 3px rgba(12,31,68,.2))}
.composer[data-state="taping"] .shell,.composer[data-state="settled"] .shell{width:var(--final-width,290px);height:var(--final-height,104px);border-radius:4px;border-color:transparent;opacity:0;pointer-events:none}
.composer[data-state="taping"] .prompt,.composer[data-state="taping"] .entry,.composer[data-state="settled"] .prompt,.composer[data-state="settled"] .entry{opacity:0;pointer-events:none;transition-delay:0s}
.composer[data-state="taping"] .formed,.composer[data-state="settled"] .formed{opacity:1;transform:translate(-50%,-50%) scale(1);transition-delay:.09s}
.composer[data-state="settled"] .formed{pointer-events:auto}
.composer.is-appearing .shell{opacity:0;transform:translate(-50%,-50%) scale(.94)}
.composer.is-appearing[data-state="writing"] .shell{opacity:1;transform:translate(-50%,-50%) scale(1);transition-delay:.17s}
.after{display:flex;align-items:center;justify-content:center;min-height:50px;margin-top:0}
.again{border:1.5px dotted var(--blue);border-radius:99px;background:#fff;color:var(--blue);padding:10px 17px;font-weight:600;font-size:11px;letter-spacing:-.015em;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .42s ease,transform .6s var(--ease)}
.again.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.again:hover{border-style:solid}
.error-msg{font-size:12px;color:#bd2b40;text-align:center;margin:0 18px 8px}.error-msg[hidden]{display:none}.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:700px){main{padding:0}.rule{margin:0 22px}h1{font-size:clamp(27px,6.2vw,39px);margin:30px 13px 12px}.stage{height:150px}.rail{height:148px;gap:24px}.note,.composer{height:148px}.composer{width:min(354px,89vw)}.shell{width:212px;height:70px;border-radius:29px}.composer[data-state="writing"] .shell{height:81px;border-radius:28px}.entry{padding:6px 9px 6px 18px}.entry textarea{font-size:13px}.send{width:39px;height:39px;flex-basis:39px}.after{min-height:45px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<section class="feature" aria-labelledby="question">
 <div class="rule"></div>
 <h1 id="question">What does <strong>borderless</strong> mean to you?</h1>
 <div class="stage" id="stage" aria-label="A single row of handwritten visions on blue paper tape">
   <div class="rail" id="rail"></div>
 </div>
 <p id="error-msg" class="error-msg" role="alert" hidden></p>
 <div class="after"><button class="again" id="again" type="button">Share another vision ↗</button></div>
 <p id="announce" class="sr-only" aria-live="polite"></p>
</section>
</main>

 for(let n=0;n<1200;n++){const x=r()*width,y=r()*height,alpha=.015+r()*.07;c.fillStyle=r()>.55?`rgba(244,250,255,${alpha})`:`rgba(4,45,112,${alpha})`;c.fillRect(x,y,.3+r()*1.3,.2+r()*.95)}
 for(let n=0;n<10;n++){let px=20+r()*(width-40);c.beginPath();c.moveTo(px,5);c.bezierCurveTo(px+3+r()*4,height*.3,px-4-r()*4,height*.7,px+(r()-.5)*10,height-5);c.strokeStyle='rgba(255,255,255,.018)';c.lineWidth=1+r()*2;c.stroke();}
 // Loose paper fibers on ripped vertical ends.
 for(let side of [0,1])for(let n=0;n<32;n++){const yy=5+r()*(height-10),xx=side?width-6-r()*8:6+r()*8;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+(side?1:-1)*(1+r()*4),yy+(r()-.5)*2);c.strokeStyle=`rgba(182,225,255,${.1+r()*.26})`;c.lineWidth=.3+r()*.45;c.stroke()}
 c.restore();
 // Pen strokes are drawn one at a time and slightly different every time.
 const padX=23;const allowed=width-padX*2;
 let scale=1.35,lines=[];
 while(scale>=.76){lines=wrapText(text,allowed,scale);if(lines.length*22*scale<height-13 && lines.length<=5)break;scale-=.055;}
 scale=Math.max(.76,scale);
 const lineHeight=21.5*scale;const totalH=lines.length*lineHeight;
 let startY=(height-totalH)/2+1;
 c.save();c.beginPath();c.rect(16,6,width-32,height-12);c.clip();
 lines.forEach((line,li)=>{
  const naturalWidth=measure(line,scale);let x=padX+Math.max(0,(allowed-naturalWidth)/2)*(.6+r()*.4),y=startY+li*lineHeight;
  for(const ch of line){if(ch===' '){x+=6*scale;continue;}x+=strokeGlyph(c,ch,x,y,scale,r)+.45*scale;}
 });c.restore();
 const el=document.createElement('div');el.className='tape-piece';el.style.width=width+'px';el.style.height=height+'px';el.style.setProperty('--rotation',((r()-.5)*1.8).toFixed(2)+'deg');el.style.setProperty('--shift',((r()-.5)*3).toFixed(1)+'px');el.appendChild(canvas);el.title=text;el.setAttribute('aria-label',text);el.tabIndex=0;
 return el;
}




// Only real, administrator-approved visions appear publicly.
const approved=[];
const stage=$('stage'),rail=$('rail'),again=$('again'),announce=$('announce');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const storageKey='borderless_google_visions_v1';
let mine=[],composer=null,mode='idle',busy=false,position=0,lastFrame=0,speed=0,hovered=false;
try{const data=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(data))mine=data.filter(x=>x&&typeof x.text==='string').slice(-20)}catch(e){}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(mine))}catch(e){}}
function showError(message){const el=$('error-msg');el.textContent=message;el.hidden=!message;}
async function loadApproved(){
 try{
  const res=await fetch('/api/visions',{cache:'no-store'});
  if(!res.ok)throw new Error('Unable to load community visions');
  const data=await res.json();
  if(!Array.isArray(data.visions))throw new Error('Unexpected community visions response');
  approved.push(...data.visions
    .filter(x=>x && typeof x.vision==='string' && x.vision.trim())
    .map(x=>({id:String(x.id||''),text:x.vision.trim(),status:'approved'})));
  const publicIds=new Set(approved.map(x=>x.id).filter(Boolean));
  mine=mine.filter(x=>!publicIds.has(x.id));save();
 }catch(err){console.warn('Community visions could not be loaded',err);}
}
function gap(){return Number.parseFloat(getComputedStyle(rail).gap)||34}
function applyX(){rail.style.transform=`translate3d(${position.toFixed(3)}px,-50%,0)`}
function centerComposer(){if(!composer)return;position=stage.clientWidth/2-(composer.offsetLeft+composer.getBoundingClientRect().width/2);applyX()}
function makeNote(item,i){
 const note=document.createElement('div');note.className='note';note.dataset.visionId=item.id;
 const piece=makeTape(item.text,i);note.style.width=piece.style.width;note.appendChild(piece);
 note.addEventListener('pointerenter',()=>hovered=true);note.addEventListener('pointerleave',()=>hovered=false);
 return note;
}
function createComposer(isNew=false){
 const node=document.createElement('div');node.className='composer';node.dataset.state='idle';
 node.innerHTML=`<div class="shell">
  <button type="button" class="prompt">Share my vision <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18 18 5M8 5h10v10"/></svg></button>
  <form class="entry" novalidate><label class="sr-only">Your vision of a borderless world</label><textarea rows="2" maxlength="120" placeholder="Write your vision…" aria-label="Write your vision of a borderless world"></textarea><button type="submit" class="send" aria-label="Submit your vision" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button></form>
 </div><div class="formed" aria-hidden="true"></div>`;
 const prompt=node.querySelector('.prompt'),form=node.querySelector('.entry'),entry=node.querySelector('textarea'),send=node.querySelector('.send');
 form.inert=true;
 prompt.addEventListener('click',()=>openEditor(node));
 entry.addEventListener('input',()=>{send.disabled=entry.value.trim().length<3});
 entry.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){event.preventDefault();form.requestSubmit()}
  if(event.key==='Escape'&&!entry.value.trim()&&mode==='writing'){event.preventDefault();closeEditor(node)}
 });
 form.addEventListener('submit',event=>{event.preventDefault();submit(node,entry,send)});
 return node;
}
function openEditor(node){
 if(busy||mode==='taping'||mode==='flowing')return;
 node.dataset.state='writing';mode='writing';node.querySelector('.entry').inert=false;
 node.querySelector('.prompt').disabled=true;
 const input=node.querySelector('textarea');setTimeout(()=>{if(node===composer)input.focus({preventScroll:true})},reduced?5:360);
}
function closeEditor(node){
 if(busy||node!==composer)return;
 node.dataset.state='idle';mode='idle';node.querySelector('.entry').inert=true;node.querySelector('.prompt').disabled=false;
 node.querySelector('.prompt').focus({preventScroll:true});
}
async function submit(node,input,send){
 if(busy||node!==composer)return;
 const text=input.value.replace(/\s+/g,' ').trim();
 if([...text].length<3){input.focus();return;}
 if([...text].length>120){showError('Please keep your vision under 120 characters.');return;}
 busy=true;send.disabled=true;showError('');
 let item;
 try{
  const response=await fetch('/api/visions',{
   method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',
   body:JSON.stringify({vision:text,website:''})
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.ok||!result.id)throw new Error(result.error||'Unable to save. Please try again.');
  item={id:String(result.id),text,status:'pending'};
 }catch(err){
  busy=false;send.disabled=false;showError(err.message||'Unable to save. Please try again.');
  input.focus();return;
 }
 mode='taping';input.blur();
 mine.push(item);mine=mine.slice(-20);save();
 const piece=makeTape(text,seed(item.id)%70);
 const reveal=node.querySelector('.formed');reveal.replaceChildren(piece);
 node.style.setProperty('--final-width',piece.style.width);node.style.setProperty('--final-height',piece.style.height);
 node.querySelector('.entry').inert=true;
 const previousWidth=node.getBoundingClientRect().width;
 const targetWidth=parseFloat(piece.style.width);
 node.dataset.state='taping';
 const morphMs=reduced?60:910;
 setTimeout(()=>{
  if(node!==composer)return;
  const duration=reduced?0:700;
  rail.style.transition=`transform ${duration}ms var(--ease)`;
  node.style.transition=`width ${duration}ms var(--ease)`;
  const difference=previousWidth-targetWidth;
  node.style.width=targetWidth+'px';
  position+=difference/2;applyX();
  setTimeout(()=>{
   rail.style.transition='none';node.style.transition='none';node.dataset.state='settled';
   node.classList.add('note');composer=null;mode='flowing';busy=false;speed=0;lastFrame=0;fillFlow();
   again.classList.add('visible');
   announce.textContent='Your vision has been received for review. You can share another.';
  },duration+30);
 },morphMs);
}
function addAnother(){
 if(busy||mode!=='flowing')return;
 busy=true;mode='opening';speed=0;again.classList.remove('visible');hovered=false;
 const stageRect=stage.getBoundingClientRect(),center=stageRect.left+stageRect.width/2;
 // Insert the composer at the nearest seam in the drifting row.
 let pivot=null,min=Infinity;
 for(const child of rail.children){const r=child.getBoundingClientRect();const d=Math.abs(r.left-center);if(d<min){min=d;pivot=child}}
 const node=createComposer(true);node.style.width='0px';node.classList.add('is-appearing');
 if(pivot)rail.insertBefore(node,pivot);else rail.appendChild(node);
 composer=node;
 // Measure in layout coordinates so the seam comes to rest exactly in the middle.
 const desiredWidth=Math.min(416,Math.max(315,stage.clientWidth*.89));
 const target=stage.clientWidth/2-(node.offsetLeft+desiredWidth/2);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  rail.style.transition=reduced?'none':'transform 850ms var(--ease)';
  node.style.transition=reduced?'none':'width 850ms var(--ease)';
  node.style.width=desiredWidth+'px';
  position=target;applyX();
  node.dataset.state='writing';node.querySelector('.entry').inert=false;
  setTimeout(()=>{
   node.classList.remove('is-appearing');rail.style.transition='none';node.style.transition='none';
   mode='writing';busy=false;node.querySelector('textarea').focus({preventScroll:true});
  },reduced?50:880);
 }));
}

// Maintain enough paper tape beyond BOTH viewport edges so there are no
// abrupt entrances or empty gaps, even with just one approved submission.
function fillFlow(){
 if(mode!=='flowing')return;
 const sources=[...approved,...mine].filter(x=>x && x.text);
 if(!sources.length)return;
 const space=gap();
 const makeFlowCopy=(item,i)=>{
  const note=makeNote(item,90+i);
  note.setAttribute('aria-hidden','true');
  const piece=note.querySelector('.tape-piece');
  if(piece)piece.tabIndex=-1;
  return note;
 };
 let count=0;
 while(rail.firstElementChild && rail.firstElementChild.getBoundingClientRect().left > -stage.clientWidth && count<40){
  const item=sources[(sources.length-1-count%sources.length+sources.length)%sources.length];
  const node=makeFlowCopy(item,count);
  rail.insertBefore(node,rail.firstElementChild);
  position-=node.offsetWidth+space;
  applyX();
  count++;
 }
 count=0;
 while(rail.lastElementChild && rail.lastElementChild.getBoundingClientRect().right < stage.clientWidth*2 && count<60){
  const item=sources[count%sources.length];
  rail.appendChild(makeFlowCopy(item,100+count));
  count++;
 }
}

function recycle(){
 if(mode!=='flowing')return;
 let count=0;
 while(count++<rail.childElementCount){
  const first=rail.firstElementChild;if(!first)break;
  const bounds=first.getBoundingClientRect();
  if(bounds.right>-60)break;
  position+=bounds.width+gap();rail.appendChild(first);applyX();
 }
}
function animate(now){
 if(!lastFrame)lastFrame=now;
 const dt=Math.min(45,now-lastFrame);lastFrame=now;
 if(mode==='flowing'&&!reduced&&!hovered){speed=Math.min(29,speed+dt*.024);position-=speed*dt/1000;applyX();recycle()}
 requestAnimationFrame(animate);
}
function init(){
 // All paper textures MUST finish loading before making a single tape strip.
 const left=[...approved.slice(0,4)];
 const right=[...approved.slice(4)];
 left.forEach((x,i)=>rail.appendChild(makeNote(x,i)));
 composer=createComposer();rail.appendChild(composer);
 mine.forEach((x,i)=>rail.appendChild(makeNote(x,20+i)));
 right.forEach((x,i)=>rail.appendChild(makeNote(x,9+i)));
 centerComposer();requestAnimationFrame(()=>centerComposer());
 again.addEventListener('click',addAnother);
 window.addEventListener('resize',()=>{if(composer&&mode!=='flowing')centerComposer();else if(mode==='flowing')fillFlow()});
 requestAnimationFrame(animate);
}
// Wait for image decoding, including on cold first load, so there are no flat-color tape strips.
Promise.allSettled([reference.decode(),loadApproved()]).then(init);
})();
</script>
<script>
// When embedded in the website, keep the iframe tightly fitted to the tape section.
(()=>{
 if(window.parent===window)return;
 function measure(){
  const height=Math.ceil(document.documentElement.scrollHeight);
  window.parent.postMessage({type:'borderless-vision-height',height},location.origin);
 }
 window.addEventListener('load',measure);
 if('ResizeObserver' in window)new ResizeObserver(measure).observe(document.body);
 measure();
})();
</script>
