
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borderless | Checkout Preview</title>
  <script src="https://js.stripe.com/endive/stripe.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 620px;
      margin: 60px auto;
      padding: 24px;
      color: #222;
    }
    h1 { font-size: 28px; }
    #status {
      margin: 24px 0;
      font-size: 14px;
    }
    #checkout-form { margin-top: 24px; }
  </style>
</head>
<body>
  <h1>borderless</h1>
  <p>Palestinian Olive Oil | 500 ml | $45</p>
  <p><strong>TEST MODE ONLY</strong></p>

  <div id="status" role="status">Initializing checkout...</div>
  <div id="checkout-form"></div>

  <script>
    const stripe = Stripe("pk_test_51UZ16NE7oxC51pBqmNAXrH7ZLjgzATYEo4RUFtn6EAQFMoF4ZGYR6H1nv8hZqyAmJ44a9vYYn2tw34E7VjhQe4rn00K3IOhTzi");
    const statusElement = document.getElementById("status");

    function setStatus(message) {
      statusElement.textContent = message;
    }

    async function updateShipping(sessionId, shippingDetails) {
      const response = await fetch("/api/checkout-shipping", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          checkout_session_id: sessionId,
          shipping_details: shippingDetails
        })
      });

      const result = await response.json();

      if (!response.ok || result.type !== "object") {
        throw new Error(
          result.message || "Unable to calculate shipping"
        );
      }

      return result;
    }

    async function initialize() {
      try {
        const response = await fetch(
          "/api/checkout-form-session",
          { method: "POST" }
        );

        const data = await response.json();

        if (!response.ok || !data.clientSecret) {
          throw new Error("Session creation failed");
        }

        const checkout = await stripe.initCheckoutFormSdk({
          clientSecret: data.clientSecret
        });

        const form = checkout.createForm();
        form.mount("#checkout-form");

        setStatus("Enter your shipping address to calculate postage.");

      
let latestAddress = null;
let latestKey = "";
let lastQuotedKey = "";
let quoteInProgress = false;

async function refreshShipping() {
  if (quoteInProgress) return;

  quoteInProgress = true;

  try {
    while (latestAddress && latestKey !== lastQuotedKey) {
      const addressKey = latestKey;
      const shippingDetails = latestAddress;

      setStatus("Calculating shipping through Shippo...");

      try {
        const loaded = await checkout.loadActions();

        if (loaded.type !== "success") {
          throw new Error("Could not load checkout actions");
        }

        const result = await loaded.actions.runServerUpdate(
          () => updateShipping(
            loaded.actions.getSession().id,
            shippingDetails
          )
        );

        if (result.type !== "success") {
          throw new Error("Could not refresh shipping total");
        }

        lastQuotedKey = addressKey;

        if (addressKey === latestKey) {
          setStatus("Shipping quote updated. Check the total.");
        }

      } catch (error) {
        if (addressKey === latestKey) {
          setStatus("Shipping error: " + error.message);
        }
        break;
      }
    }
  } finally {
    quoteInProgress = false;
  }
}


form.on("change", ({ value }) => {
  const details = value?.shippingAddress;
  const address = details?.address;

  const addressReady =
    address?.country?.toUpperCase() === "US" &&
    Boolean(address?.line1?.trim()) &&
    Boolean(address?.city?.trim()) &&
    Boolean(address?.state?.trim()) &&
    /^\d{5}(-\d{4})?$/.test(address?.postal_code || "");

  if (!addressReady) {
    latestAddress = null;
    latestKey = "";
    lastQuotedKey = "";
    setStatus("Enter your delivery address to calculate shipping.");
    return;
  }

  const addressKey = JSON.stringify([
    address.line1 || "",
    address.line2 || "",
    address.city || "",
    address.state || "",
    address.postal_code || "",
    address.country || ""
  ]);

  latestAddress = details;
  latestKey = addressKey;

  void refreshShipping();
});


form.on("confirm", async (event) => {
  try {
    // Keep express wallets disabled during shipping validation.
    if (event.source !== "checkout-form-pay-button") {
      setStatus("Please use the regular payment form.");
      return;
    }

    const current = await form.getValue();
    const address = current.value?.shippingAddress?.address;

    const currentKey = address && JSON.stringify([
      address.line1 || "",
      address.line2 || "",
      address.city || "",
      address.state || "",
      address.postal_code || "",
      address.country || ""
    ]);

    // Reject missing, outdated, or pending shipping quotes.
    if (
      !currentKey ||
      quoteInProgress ||
      currentKey !== latestKey ||
      currentKey !== lastQuotedKey
    ) {
      setStatus(
        "Please wait for shipping to finish calculating before paying."
      );
      return;
    }

    const loaded = await checkout.loadActions();

    if (loaded.type !== "success") {
      throw new Error("Unable to verify checkout.");
    }

    const shippingCents =
      loaded.actions.getSession()?.total?.shippingRate
        ?.minorUnitsAmount;

    if (
      !Number.isInteger(shippingCents) ||
      shippingCents <= 0
    ) {
      setStatus(
        "A valid shipping price is required before payment."
      );
      return;
    }

    setStatus("Confirming test payment...");

    const result = await loaded.actions.confirm({
      formConfirmEvent: event
    });

    if (result.type === "error") {
      throw new Error(result.error.message);
    }

    setStatus("Test payment submitted successfully.");

  } catch (error) {
    setStatus("Checkout error: " + error.message);
  }
});



      } catch (error) {
        setStatus("Checkout error: " + error.message);
      }
    }

    initialize();
  </script>
</body>
</html>
